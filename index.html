<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div id="header">Calculator App</div>
    <div id="content">
        <div class="calcContainer">
            <div class="calcRow">
                <div id="calcDisplay">Display</div>
                <button>C</button>
            </div>
            <div class="calcRow">
                <button>7</button>
                <button>8</button>
                <button>9</button>
                <button>+</button>
            </div>
            <div class="calcRow">
                <button>4</button>
                <button>5</button>
                <button>6</button>
                <button>-</button>
            </div>
            <div class="calcRow">
                <button>1</button>
                <button>2</button>
                <button>3</button>
                <button>×</button>
            </div>
            <div class="calcRow">
                <button>=</button>
                <button>0</button>
                <button>.</button>
                <button>÷</button>
            </div>
        </div>
    </div>
    <div id="footer">A Little Something by Erik</div>
    <script src="script.js"></script>
</body>

</html>
